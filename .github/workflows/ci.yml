name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import and load check
        run: |
          godot --headless --audio-driver Dummy --path godot --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log
      - name: Core logic tests
        run: |
          godot --headless --audio-driver Dummy --path godot --script res://tests/test_core.gd 2>&1 | tee test.log
          grep -E "test_core: [0-9]+ passed, 0 failed" test.log
